<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>MathLine</title>
	<link rel="icon" type="image/svg+xml"
		href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23E31717'/%3E%3Ccircle cx='50' cy='50' r='33' fill='none' stroke='%23E31717' stroke-width='3'/%3E%3C/svg%3E" />
	<style>
		:root {
			--accent: #fff;
			--text: #fff;
			--nav: #0f1419;
			--nav-w: 0px;
			--top: #0a0e14;
			--top-h: 56px;
			--bg: #0d1117;
			--card-bg: #161b22;
			--card-hover: #1c2128;
			--theme: 'dark';
			--bg-style: 'stars';
			--bg-brightness: 0.3;
		}

		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			height: 100%;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
			color: var(--text);
			background: var(--bg);
			overflow: hidden;
		}

		body::before {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 1;
			background-image:
				radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.5), rgba(0, 0, 0, 0)),
				radial-gradient(2px 2px at 60px 70px, rgba(255, 255, 255, 0.5), rgba(0, 0, 0, 0)),
				radial-gradient(1px 1px at 50px 50px, rgba(255, 255, 255, 0.8), rgba(0, 0, 0, 0)),
				radial-gradient(1px 1px at 130px 80px, rgba(255, 255, 255, 0.8), rgba(0, 0, 0, 0)),
				radial-gradient(2px 2px at 90px 10px, rgba(255, 255, 255, 0.5), rgba(0, 0, 0, 0));
			background-repeat: repeat;
			background-size: 200px 200px;
			animation: twinkle 5s ease-in-out infinite;
			opacity: var(--bg-brightness);
		}

		body.bg-none::before {
			display: none;
		}

		body.bg-rain::before {
			background-image:
				linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .05) 75%, rgba(255, 255, 255, .05) 76%, transparent 77%, transparent 100%),
				linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px);
			background-size: 50px 50px;
			animation: rain 0.3s linear infinite;
		}

		body.bg-grid::before {
			background-image:
				linear-gradient(0deg, transparent 24%, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .05) 75%, rgba(255, 255, 255, .05) 76%, transparent 77%, transparent 100%),
				linear-gradient(90deg, transparent 24%, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .05) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, .05) 75%, rgba(255, 255, 255, .05) 76%, transparent 77%, transparent 100%);
			background-size: 50px 50px;
			animation: none;
		}

		body.bg-dots::before {
			background-image: radial-gradient(circle, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
			background-size: 20px 20px;
			animation: none;
		}

		body.bg-lines::before {
			background-image: repeating-linear-gradient(0deg,
					transparent,
					transparent 49px,
					rgba(255, 255, 255, 0.1) 49px,
					rgba(255, 255, 255, 0.1) 50px);
			animation: none;
		}

		body.bg-waves::before {
			background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.05) 50%, transparent 70%);
			background-size: 100px 100px;
			animation: wave 2s linear infinite;
		}

		body.bg-nebula::before {
			background:
				radial-gradient(ellipse at 20% 50%, rgba(255, 100, 255, 0.1) 0%, transparent 50%),
				radial-gradient(ellipse at 80% 50%, rgba(100, 100, 255, 0.1) 0%, transparent 50%),
				radial-gradient(ellipse at 50% 0%, rgba(100, 255, 200, 0.05) 0%, transparent 50%);
			animation: nebula 8s ease-in-out infinite;
		}

		@keyframes twinkle {

			0%,
			100% {
				opacity: calc(var(--bg-brightness) * 0.5);
			}

			50% {
				opacity: calc(var(--bg-brightness) * 1.5);
			}
		}

		@keyframes rain {
			0% {
				transform: translateY(-100%);
			}

			100% {
				transform: translateY(100vh);
			}
		}

		@keyframes wave {
			0% {
				transform: translateX(0);
			}

			100% {
				transform: translateX(100px);
			}
		}

		@keyframes nebula {

			0%,
			100% {
				opacity: calc(var(--bg-brightness) * 0.5);
			}

			50% {
				opacity: calc(var(--bg-brightness) * 1.5);
			}
		}

		#topbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: var(--top-h);
			background: var(--top);
			z-index: 30;
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 0 16px;
			border-bottom: 1px solid rgba(255, 255, 255, .1);
			box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
		}

		#logo {
			font-size: 1.3rem;
			font-weight: 800;
			color: #fff;
			text-shadow: 0 0 10px rgba(255, 255, 255, .3);
			white-space: nowrap;
			letter-spacing: -.5px;
		}

		#search {
			flex: 1;
			max-width: 480px;
			background: rgba(255, 255, 255, .05);
			color: var(--text);
			padding: 8px 14px;
			font-size: 14px;
			border-radius: 20px;
			border: 1px solid rgba(255, 255, 255, .1);
			outline: none;
			transition: border-color .2s, background .2s;
		}

		#search:focus {
			border-color: rgba(255, 255, 255, .3);
			background: rgba(255, 255, 255, .1);
		}

		#search::placeholder {
			color: rgba(255, 255, 255, .35);
		}

		#top-right {
			margin-left: auto;
			display: flex;
			align-items: center;
			gap: 10px;
		}

		#settings-btn {
			width: 36px;
			height: 36px;
			border-radius: 50%;
			border: none;
			background: rgba(255, 255, 255, .08);
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background .2s;
		}

		#settings-btn:hover {
			background: rgba(255, 255, 255, .15);
		}

		#info-btn {
			width: 36px;
			height: 36px;
			border-radius: 50%;
			border: none;
			background: rgba(255, 255, 255, .08);
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background .2s;
		}

		#info-btn:hover {
			background: rgba(255, 255, 255, .15);
		}

		#nav {
			display: none;
		}

		#main {
			position: fixed;
			top: var(--top-h);
			left: 0;
			right: 0;
			bottom: 0;
			overflow-y: auto;
			background: transparent;
			scrollbar-width: thin;
			scrollbar-color: rgba(255, 255, 255, .15) transparent;
			z-index: 2;
		}

		#content {
			padding: 20px 20px 40px;
		}

		.section-header {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 14px;
			margin-top: 24px;
		}

		.section-header:first-child {
			margin-top: 0;
		}

		.section-title {
			font-size: 1rem;
			font-weight: 700;
			color: #fff;
		}

		.section-count {
			font-size: 12px;
			color: rgba(255, 255, 255, .4);
			font-weight: 400;
		}

		#game-list {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
			gap: 12px;
		}

		.card {
			background: var(--card-bg);
			border-radius: 10px;
			cursor: pointer;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, .1);
			transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
			position: relative;
		}

		.card:hover {
			transform: translateY(-3px) scale(1.02);
			border-color: rgba(255, 255, 255, .2);
			background: var(--card-hover);
			box-shadow: 0 4px 12px rgba(255, 255, 255, .1);
		}

		.card-thumb {
			width: 100%;
			aspect-ratio: 16/9;
			position: relative;
			overflow: hidden;
			background: linear-gradient(135deg, #1c2128, #0d1117);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.card-thumb-grad {
			width: 100%;
			height: 100%;
			position: absolute;
			inset: 0;
		}

		.card-initials {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.8rem;
			font-weight: 800;
			letter-spacing: -.02em;
			color: rgba(255, 255, 255, .15);
			text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
			user-select: none;
		}

		.card-info {
			padding: 8px 10px 10px;
		}

		.card-name {
			font-size: 13px;
			font-weight: 600;
			color: rgba(255, 255, 255, .95);
			line-height: 1.3;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.card-fav {
			position: absolute;
			top: 6px;
			right: 6px;
			background: rgba(0, 0, 0, .6);
			border: none;
			cursor: pointer;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			font-size: 14px;
			color: rgba(255, 255, 255, .5);
			display: flex;
			align-items: center;
			justify-content: center;
			opacity: 0;
			transition: opacity .15s, color .15s;
			z-index: 2;
			box-shadow: 0 2px 4px rgba(0, 0, 0, .3);
		}

		.card:hover .card-fav {
			opacity: 1;
		}

		.card-faon {
			opacity: 1;
			color: #ffd700;
		}

		.card-fav:hover {
			color: #ffd700;
		}

		.card.req {
			border: 2px dashed rgba(255, 165, 0, .5);
		}

		.card.req .card-name {
			color: #ffa500;
		}

		body.glow-on .card:hover {
			box-shadow: 0 0 18px rgba(255, 255, 255, .3);
		}

		body.hover-off .card:hover {
			transform: none !important;
		}

		#overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 50;
			background: #000;
			flex-direction: column;
		}

		#overlay.on {
			display: flex;
		}

		#gframe {
			flex: 1;
			width: 100%;
			border: none;
			background: #000;
		}

		#gload {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000;
			z-index: 2;
		}

		#gload.hide {
			display: none;
		}

		.spin {
			border: 4px solid rgba(255, 255, 255, .2);
			border-top: 4px solid #fff;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin-bottom: 18px;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		#bar-wrap {
			width: 260px;
			height: 8px;
			background: rgba(255, 255, 255, .15);
			border-radius: 99px;
			overflow: hidden;
			margin-top: 14px;
		}

		#bar {
			height: 100%;
			width: 0;
			background: #fff;
			border-radius: 99px;
			box-shadow: 0 0 8px rgba(255, 255, 255, .5);
		}

		#bar-lbl {
			margin-top: 10px;
			font-size: 13px;
			color: rgba(255, 255, 255, .5);
		}

		#fs-btn {
			position: fixed;
			right: 18px;
			top: 18px;
			padding: 8px 14px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			z-index: 60;
			font-weight: 700;
			background: #fff;
			color: #000;
		}

		#bk-btn {
			position: fixed;
			left: 18px;
			top: 18px;
			padding: 8px 14px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			z-index: 60;
			font-weight: 700;
			background: rgba(0, 0, 0, .55);
			color: #fff;
		}

		#browser-page {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 10;
			top: var(--top-h);
		}

		#browser-page.on {
			display: flex;
			flex-direction: column;
		}

		#browser-page iframe {
			width: 100%;
			height: 100%;
			border: none;
		}

		.modal {
			display: none;
			position: fixed;
			z-index: 55;
			inset: 0;
			background: rgba(0, 0, 0, .75);
			backdrop-filter: blur(6px);
		}

		.modal.on {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.modal-box {
			background: #0d1117;
			padding: 28px;
			border-radius: 14px;
			max-width: 460px;
			width: 90%;
			color: var(--text);
			border: 1px solid rgba(255, 255, 255, .1);
			max-height: 80vh;
			overflow-y: auto;
			box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
		}

		.modal-thumb {
			width: 100%;
			aspect-ratio: 16/9;
			border-radius: 8px;
			overflow: hidden;
			margin-bottom: 18px;
			position: relative;
			background: linear-gradient(135deg, #1c2128, #0d1117);
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.modal-thumb-grad {
			width: 100%;
			height: 100%;
		}

		.modal-thumb-title {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 2.5rem;
			font-weight: 800;
			color: rgba(255, 255, 255, .15);
			letter-spacing: -.02em;
		}

		.mtrow {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 14px;
		}

		.mtrow h2 {
			flex: 1;
			font-size: 1.2rem;
			color: #fff;
		}

		.mfav {
			font-size: 22px;
			background: none;
			border: none;
			cursor: pointer;
			color: rgba(255, 255, 255, .3);
			transition: color .2s;
			padding: 4px;
		}

		.mfav:hover,
		.mfaon {
			color: #ffd700;
		}

		.mstat {
			display: flex;
			justify-content: space-between;
			padding: 8px 0;
			border-bottom: 1px solid rgba(255, 255, 255, .1);
			font-size: 14px;
		}

		.mstat:last-of-type {
			border: none;
		}

		.mstat b {
			color: rgba(255, 255, 255, .5);
			font-weight: 600;
		}

		.mbtns {
			display: flex;
			gap: 10px;
			margin-top: 18px;
			justify-content: center;
		}

		.mbtns button {
			padding: 10px 22px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 700;
			font-size: 14px;
		}

		.mbplay {
			background: #fff;
			color: #000;
		}

		.mbplay:hover {
			filter: brightness(0.9);
		}

		.mbclose {
			background: rgba(255, 255, 255, .1);
			color: var(--text);
			border: 1px solid rgba(255, 255, 255, .2);
		}

		.mbclose:hover {
			background: rgba(255, 255, 255, .18);
		}

		/* Settings Drawer */
		#settings-drawer {
			position: fixed;
			right: -420px;
			top: 0;
			bottom: 0;
			width: 400px;
			background: #0a0e14;
			z-index: 100;
			transition: right .3s;
			overflow: hidden;
			border-left: 1px solid rgba(255, 255, 255, .1);
			box-shadow: -2px 0 30px rgba(0, 0, 0, .5);
			display: flex;
			flex-direction: column;
		}

		#settings-drawer.open {
			right: 0;
		}

		.settings-header {
			padding: 18px 20px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			border-bottom: 1px solid rgba(255, 255, 255, .1);
			flex-shrink: 0;
		}

		.settings-header h2 {
			color: #fff;
			font-size: 1.2rem;
		}

		.settings-close-btn {
			background: none;
			border: none;
			color: rgba(255, 255, 255, .4);
			font-size: 22px;
			cursor: pointer;
			padding: 4px;
			transition: color .2s;
		}

		.settings-close-btn:hover {
			color: #fff;
		}

		.settings-content {
			flex: 1;
			overflow-y: auto;
			scrollbar-width: thin;
			scrollbar-color: rgba(255, 255, 255, .1) transparent;
			padding: 16px 18px;
		}

		.settings-group {
			margin-bottom: 20px;
		}

		.settings-group-title {
			display: block;
			color: rgba(255, 255, 255, .45);
			font-weight: 700;
			font-size: 11px;
			letter-spacing: .06em;
			text-transform: uppercase;
			margin-bottom: 12px;
		}

		.settings-description {
			font-size: 12px;
			color: rgba(255, 255, 255, .35);
			margin-top: 6px;
			line-height: 1.4;
		}

		/* Brightness Slider Styles */
		.brightness-slider {
			width: 100%;
			height: 6px;
			border-radius: 3px;
			background: rgba(255, 255, 255, .1);
			outline: none;
			-webkit-appearance: none;
			appearance: none;
			margin: 12px 0;
		}

		.brightness-slider::-webkit-slider-thumb {
			-webkit-appearance: none;
			appearance: none;
			width: 16px;
			height: 16px;
			border-radius: 50%;
			background: #fff;
			cursor: pointer;
			box-shadow: 0 0 8px rgba(255, 255, 255, .5);
		}

		.brightness-slider::-moz-range-thumb {
			width: 16px;
			height: 16px;
			border-radius: 50%;
			background: #fff;
			cursor: pointer;
			border: none;
			box-shadow: 0 0 8px rgba(255, 255, 255, .5);
		}

		.brightness-label {
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 12px;
			color: rgba(255, 255, 255, .6);
			margin-bottom: 8px;
		}

		.brightness-value {
			color: rgba(255, 255, 255, .8);
			font-weight: 600;
		}

		/* Info Modal */
		#info-modal {
			display: none;
			position: fixed;
			z-index: 105;
			inset: 0;
			background: rgba(0, 0, 0, .75);
			backdrop-filter: blur(6px);
		}

		#info-modal.on {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.info-box {
			background: #0d1117;
			padding: 28px;
			border-radius: 14px;
			max-width: 500px;
			width: 90%;
			color: #fff;
			border: 1px solid rgba(255, 255, 255, .1);
			max-height: 80vh;
			overflow-y: auto;
			box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
		}

		.info-box h2 {
			margin-bottom: 16px;
			font-size: 1.3rem;
		}

		.info-textarea {
			width: 100%;
			height: 300px;
			background: rgba(255, 255, 255, .05);
			border: 1px solid rgba(255, 255, 255, .1);
			border-radius: 8px;
			color: #fff;
			padding: 12px;
			font-family: 'Courier New', monospace;
			font-size: 13px;
			resize: none;
			margin-bottom: 16px;
		}

		.info-textarea::placeholder {
			color: rgba(255, 255, 255, .3);
		}

		.info-textarea:focus {
			outline: none;
			border-color: rgba(255, 255, 255, .3);
			background: rgba(255, 255, 255, .08);
		}

		.info-footer {
			display: flex;
			gap: 10px;
			justify-content: center;
		}

		.info-btn {
			padding: 10px 20px;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 600;
			font-size: 14px;
			transition: all .2s;
		}

		.info-btn-primary {
			background: rgba(255, 255, 255, .2);
			color: #fff;
			border: 1px solid rgba(255, 255, 255, .3);
		}

		.info-btn-primary:hover {
			background: rgba(255, 255, 255, .3);

		.info-btn-secondary {
			background: rgba(255, 255, 255, .05);
			color: rgba(255, 255, 255, .8);

		.info-btn-secondary:hover {

	</style>
</head>

<body>
	<div id="topbar">
		<div id="logo">MathLine</div>
		<input id="search" type="text" placeholder="Search games..." />
		<div id="top-right">
			<button id="info-btn">ℹ️</button>
			<button id="settings-btn">⚙️</button>
		</div>
	</div>

	<div id="main">
		<div id="content">
			<div class="section-header">
				<h1 class="section-title">Games</h1>
				<span class="section-count" id="game-count">0 games</span>
			</div>
			<div id="game-list"></div>
		</div>
	</div>

	<!-- Settings Drawer -->
	<div id="settings-drawer">
		<div class="settings-header">
			<h2>Settings</h2>
			<button class="settings-close-btn" id="settings-close-btn">✕</button>
		</div>
		<div class="settings-content">
			<div class="settings-group">
				<span class="settings-group-title">Background Brightness</span>
				<div class="brightness-label">
					<span>Adjust brightness:</span>
					<span class="brightness-value" id="brightness-value">30%</span>
				</div>
				<input type="range" id="brightness-slider" class="brightness-slider" min="0" max="100" value="30">
				<p class="settings-description">Increase brightness to see grid lines, dots, and other background patterns more clearly.</p>
			</div>
		</div>
	</div>

	<!-- Game Modal -->
	<div class="modal" id="game-modal">
		<div class="modal-box">
			<div class="modal-thumb">
				<div class="modal-thumb-grad" id="modal-thumb-grad"></div>
				<div class="modal-thumb-title" id="modal-thumb-title">A</div>
			</div>
			<div class="mtrow">
				<h2 id="modal-game-name">Game Name</h2>
				<button class="mfav" id="modal-fav">☆</button>
			</div>
			<div id="game-stats"></div>
			<div class="mbtns">
				<button class="mbplay" id="play-game-btn">Play</button>
				<button class="mbclose" id="close-game-modal">Close</button>
			</div>
		</div>
	</div>

	<!-- Overlay for Game -->
	<div id="overlay">
		<iframe id="gframe"></iframe>
		<div id="gload">
			<div class="spin"></div>
			<div id="bar-lbl">Loading...</div>
			<div id="bar-wrap">
				<div id="bar"></div>
			</div>
		</div>
		<button id="fs-btn">Fullscreen</button>
		<button id="bk-btn">← Back</button>
	</div>

	<!-- Info Modal -->
	<div id="info-modal">
		<div class="info-box">
			<h2>Notes & Information</h2>
			<textarea class="info-textarea" id="info-textarea" placeholder="Write or paste any information here. Your notes will be saved locally."></textarea>
			<div class="info-footer">
				<button class="info-btn info-btn-primary" id="save-info">Save</button>
				<button class="info-btn info-btn-secondary" id="close-info">Close</button>

		</div>
	</div>

	<script>
		const GAMES=[

		  {n:'1v1 Lol',u:'1v1-lol.html',c:'2 Player'},
		  {n:'Happy Wheels',u:'Happy-wheels.html',c:'Action'},
		  {n:'Idle Miner Tycoon',u:'Idle-miner-tycoon.html',c:'Simulation'},
		  {n:'Jack Smith',u:'Jack-smith.html',c:'Action'},
		  {n:'Tunnel Rush',u:'Tunnel-rush.html',c:'Racing'},
		  {n:'Duck Life 5',u:'Duck-life-5.html',c:'Simulation'},
		  {n:'Duck Life 4',u:'Duck-life-4.html',c:'Simulation'},
		  {n:'Mob Control',u:'Mob-control.html',c:'Action'},
		  {n:'A Small World Cup',u:'A-small-world-cup.html',c:'2 Player'},
		  {n:'Escape Road',u:'Escape-road.html',c:'Racing'},

		  {n:'Infinite Craft',u:'Infinte-craft.html',c:'Simulation'},
		  {n:'Block Blast',u:'Block-blast.html',c:'Arcade'},
		  {n:'Melon Playground',u:'Melon-playground.html',c:'Simulation'},
		  {n:'House of Hazards',u:'house-of-hazards.html',c:'2 Player'},
		  {n:'Binding of Isaac',u:'Binding-of-issac.html',c:'Action'},
		  {n:'Troll Face Quest 10',u:'Troll-face-10.html',c:'Puzzle'},
		  {n:'Troll Face Quest 11',u:'Troll-face-11.html',c:'Puzzle'},
		  {n:'Troll Face Quest 12',u:'Troll-face-12.html',c:'Puzzle'},
		  {n:'Ultimate Car Simulator 3',u:'ultimate-car-simulator.html',c:'Racing'},
		  {n:'Wordle',u:'Wordle.html',c:'Puzzle'},
		  {n:'Capybara Clicker',u:'Cappybara-clicker.html',c:'Simulation'},
		  {n:'Bob The Robber 5',u:'bob-robber.html',c:'Action'},
		  {n:'Car Crash 3D',u:'Car-crash-3d.html',c:'Racing'},
		  {n:'BitLife',u:'Bit-life.html',c:'Simulation'},
		  {n:'Plants vs Zombies',u:'Plants-vs-zombies.html',c:'Action'},
		  {n:'Tall Man Run',u:'tall-man-run.html',c:'Racing'},
		  {n:'Tag',u:'tag.html',c:'2 Player'},
		  {n:'Subway Surfers Winter',u:'Subway-Winter.html',c:'Racing'},
		  {n:'Subway Surfers Miami',u:'Subway-miami.html',c:'Racing'},
		  {n:'Hole.io',u:'Hole-io.html',c:'Simulation'},
		  {n:'Drift Boss',u:'Drift-boss.html',c:'Racing'},
		  {n:'Subway Surfers Mexico',u:'Subway-mexico.html',c:'Racing'},
		  {n:'Subway Surfers London',u:'Subway-london.html',c:'Racing'},
		  {n:'Subway Surfers Iceland',u:'Subway-iceland.html',c:'Racing'},
		  {n:'Granny 2',u:'Granny2.html',c:'Puzzle'},
		  {n:'Granny 3',u:'Granny3.html',c:'Puzzle'},
		  {n:'Factory Balls 2',u:'Factory-balls2.html',c:'Simulation'},
		  {n:'Factory Balls 3',u:'Factory-balls3.html',c:'Simulation'},
		  {n:'Geometry Dash Lite',u:'Geometry-Dash.html',c:'Racing'},
		  {n:'Hardware Tycoon',u:'Hardware-tycoon.html',c:'Arcade'},
		  {n:'CSGO Clicker',u:'CsGo-clicker.html',c:'Arcade'},
		  {n:'Crossy Road',u:'Crossy-road.html',c:'Arcade'},
		  {n:'Burrito Bison',u:'BB.html',c:'Arcade'},
		  {n:'Burrito Bison Launcha Libre',u:'BL.html',c:'Arcade'},
		  {n:'Burrito Bison Revenge',u:'BR.html',c:'Arcade'},
		  {n:'Space Waves',u:'Space-waves.html',c:'Arcade'},
		  {n:'Zelda Ocarina',u:'Zelda0.html',c:'Arcade'},
		  {n:'Pokemon Emerald Randomized',u:'PER.html',c:'Arcade'},
		  {n:'Rooftop Snipers',u:'RF.html',c:'2 Player'},
		  {n:'Ultimate Car Simulator',u:'Ucarsim.html',c:'Racing'},
		  {n:'Traffic Jam 3D',u:'Tj.html',c:'Arcade'},
		  {n:"Papa's Freezeria",u:'Pf.html',c:'Simulation'},
		  {n:"Papa's Pastaria",u:'Pp.html',c:'Simulation'},
		  {n:"Papa's Sushiria",u:'Ps.html',c:'Simulation'},
		  {n:'Ballz',u:'Ballz.html',c:'Arcade'},
		  {n:'10 Minutes Till Dawn',u:'10min.html',c:'Arcade'},
		  {n:'Minecraft',u:'EaglerCraft 1.12 [wasm].html',c:'Arcade'},
		  {n:'Rocket League',u:'goal.html',c:'Arcade'},
		  {n:'Pixel Battleground',u:'pg.html',c:'Arcade'},
		  {n:'BTD5',u:'BTD5.html',c:'Arcade'},
		  {n:'Brotato',u:'BroT.html',c:'Arcade'},
		  {n:'Dungeons & Degenerate Gamblers',u:'DaDG.html',c:'Arcade'},
		  {n:'Eggy Car',u:'Eggy-car.html',c:'Puzzle'},
		  {n:'Mr. Mine',u:'miner.html',c:'Arcade'},
		  {n:'Jet Rush',u:'jet.html',c:'Racing'},
		  {n:'Moto X3M Spooky Land',u:'motosp.html',c:'Racing'},
		  {n:'Moto X3M Pool Party',u:'motobp.html',c:'Racing'},
		  {n:'Shred Sauce',u:'ShredS.html',c:'Racing'},
		  {n:'Choppy Orc',u:'ChoppyO.html',c:'Arcade'},
		  {n:'Bad Ice Cream 3',u:'BI3.html',c:'Arcade'},
		];

		let favorites = new Set(JSON.parse(localStorage.getItem('favorites') || '[]'));
		let allGames = [...GAMES];
		let settings = {
			animations: localStorage.getItem('animations') !== 'false',
			glow: localStorage.getItem('glow') === 'true',
			shadow: localStorage.getItem('shadow') !== 'false',
			autoload: localStorage.getItem('autoload') !== 'false',
			sound: localStorage.getItem('sound') === 'true',
			bgEffect: localStorage.getItem('bgEffect') || 'stars',
			bgSpeed: localStorage.getItem('bgSpeed') || '5',
			hoverEffect: localStorage.getItem('hoverEffect') !== 'false',
			smoothScroll: localStorage.getItem('smoothScroll') !== 'false',
			gridSize: localStorage.getItem('gridSize') || '160',
			playcount: localStorage.getItem('playcount') === 'true',
			bgBrightness: localStorage.getItem('bgBrightness') || '30'
		};

		// Initialize brightness from localStorage
		function initBrightness() {
			const brightness = settings.bgBrightness;
			document.getElementById('brightness-slider').value = brightness;
			updateBrightness(brightness);
		}

		// Brightness slider event listener
		document.getElementById('brightness-slider').addEventListener('input', (e) => {
			const value = e.target.value;
			updateBrightness(value);
			settings.bgBrightness = value;
			localStorage.setItem('bgBrightness', value);
		});

		function updateBrightness(value) {
			document.documentElement.style.setProperty('--bg-brightness', value / 100);
			document.getElementById('brightness-value').textContent = value + '%';
		}

		// Settings drawer toggle
		document.getElementById('settings-btn').addEventListener('click', () => {
			document.getElementById('settings-drawer').classList.add('open');
		});

		document.getElementById('settings-close-btn').addEventListener('click', () => {
			document.getElementById('settings-drawer').classList.remove('open');
		});

		// Info modal
		document.getElementById('info-btn').addEventListener('click', () => {
			document.getElementById('info-modal').classList.add('on');
			document.getElementById('info-textarea').value = localStorage.getItem('notes') || '';
		});

		document.getElementById('close-info').addEventListener('click', () => {
			document.getElementById('info-modal').classList.remove('on');
		});

		document.getElementById('save-info').addEventListener('click', () => {
			const notes = document.getElementById('info-textarea').value;
			localStorage.setItem('notes', notes);
			alert('Notes saved!');
		});

		// Game list rendering
		function renderGames() {
			const gameList = document.getElementById('game-list');
			gameList.innerHTML = '';
			allGames.forEach((game, idx) => {
				const card = document.createElement('div');
				card.className = 'card';
				const isFav = favorites.has(game.n);
				card.innerHTML = `
					<div class="card-thumb">
						<div class="card-thumb-grad"></div>
						<div class="card-initials">${game.n.charAt(0)}</div>
					</div>
					<div class="card-info">
						<div class="card-name">${game.n}</div>
					</div>
					<button class="card-fav ${isFav ? 'card-faon' : ''}" data-fav="${game.n}">☆</button>
				`;
				card.addEventListener('click', () => showGameModal(game));
				card.querySelector('.card-fav').addEventListener('click', (e) => {
					e.stopPropagation();
					toggleFavorite(game.n);
					renderGames();
				});
				gameList.appendChild(card);
			});
			document.getElementById('game-count').textContent = `${allGames.length} games`;
		}

		function showGameModal(game) {
			document.getElementById('modal-thumb-title').textContent = game.n.charAt(0);
			document.getElementById('modal-game-name').textContent = game.n;
			document.getElementById('game-stats').innerHTML = `
				<div class="mstat"><b>Category:</b> <span>${game.c}</span></div>
			`;
			if (favorites.has(game.n)) {
				document.getElementById('modal-fav').classList.add('mfaon');
			} else {
				document.getElementById('modal-fav').classList.remove('mfaon');
			}
			document.getElementById('play-game-btn').onclick = () => playGame(game.u);
			document.getElementById('close-game-modal').onclick = () => {
				document.getElementById('game-modal').classList.remove('on');
			};
			document.getElementById('modal-fav').onclick = () => {
				toggleFavorite(game.n);
				showGameModal(game);
			};
			document.getElementById('game-modal').classList.add('on');
		}

		function toggleFavorite(gameName) {
			if (favorites.has(gameName)) {
				favorites.delete(gameName);
			} else {
				favorites.add(gameName);
			}
			localStorage.setItem('favorites', JSON.stringify([...favorites]));
		}

		function playGame(url) {
			document.getElementById('overlay').classList.add('on');
			document.getElementById('gload').classList.remove('hide');
			document.getElementById('gframe').src = url;
			document.getElementById('game-modal').classList.remove('on');

			setTimeout(() => {
				document.getElementById('gload').classList.add('hide');
			}, 3000);
		}

		document.getElementById('bk-btn').addEventListener('click', () => {
			document.getElementById('overlay').classList.remove('on');
			document.getElementById('gframe').src = '';
		});

		document.getElementById('fs-btn').addEventListener('click', () => {
			const elem = document.getElementById('gframe');
			if (elem.requestFullscreen) {
				elem.requestFullscreen();
			}
		});

		// Search functionality
		document.getElementById('search').addEventListener('input', (e) => {
			const query = e.target.value.toLowerCase();
			allGames = GAMES.filter(g => g.n.toLowerCase().includes(query));
			renderGames();
		});

		// Initialize
		initBrightness();
		renderGames();
	</script>
</body>
