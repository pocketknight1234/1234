<style>
:root{
  --accent:#000;--text:#000;
  --bg:#ffffff;--card-bg:#f5f5f5;
  --card-hover:#e8e8e8;--border:#ddd;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;color:var(--text);background:var(--bg);overflow-x:hidden;}
#topbar{position:fixed;top:0;left:0;right:0;height:60px;background:#fff;z-index:30;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.05);}
#logo{font-size:1.5rem;font-weight:900;color:#000;white-space:nowrap;letter-spacing:-.5px;}
#search{flex:1;max-width:400px;background:#f5f5f5;color:var(--text);padding:10px 16px;font-size:15px;border-radius:6px;border:1px solid var(--border);outline:none;transition:border-color .2s;}
#search:focus{border-color:#000;background:#fff;}
#search::placeholder{color:#999;}
#top-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
#settings-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:#f5f5f5;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
#settings-btn:hover{background:#e8e8e8;}
#settings-btn.hide{display:none;}
#main{position:fixed;top:60px;left:0;right:0;bottom:0;overflow-y:auto;background:var(--bg);scrollbar-width:thin;scrollbar-color:#ccc #f5f5f5;}
#content{padding:32px 24px 40px;max-width:1400px;margin:0 auto;}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:20px;margin-top:0;}
.section-title{font-size:1.1rem;font-weight:700;color:#000;}
.section-count{font-size:13px;color:#999;font-weight:400;}
#game-list{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
.card{background:var(--card-bg);border-radius:8px;cursor:pointer;overflow:hidden;border:1px solid var(--border);transition:all .2s;position:relative;}
.card:hover{transform:translateY(-2px);background:var(--card-hover);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.card-thumb{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(135deg,#e0e0e0,#d0d0d0);}
.card-thumb-grad{width:100%;height:100%;}
.card-initials{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:rgba(0,0,0,.15);text-shadow:0 1px 3px rgba(0,0,0,.05);}
.card-info{padding:12px;}
.card-name{font-size:14px;font-weight:600;color:#000;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-fav{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border:1px solid var(--border);cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:14px;color:#999;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .2s;}
.card:hover .card-fav{opacity:1;}
.card-fav.on{color:#ffd700;background:#fff;}
.card-fav:hover{color:#ffd700;}
#overlay{display:none;position:fixed;inset:0;z-index:50;background:#000;flex-direction:column;}
#overlay.on{display:flex;}
#gframe{flex:1;width:100%;border:none;background:#000;}
#gload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:2;}
#gload.hide{display:none;}
.spin{border:4px solid #ddd;border-top:4px solid #000;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin-bottom:18px;}
@keyframes spin{to{transform:rotate(360deg);}}
#bar-wrap{width:260px;height:6px;background:#ddd;border-radius:99px;overflow:hidden;margin-top:14px;}
#bar{height:100%;width:0;background:#000;border-radius:99px;}
#bar-lbl{margin-top:10px;font-size:13px;color:#999;}
#fs-btn{position:fixed;right:18px;top:18px;padding:10px 16px;border-radius:6px;border:1px solid #000;cursor:pointer;z-index:60;font-weight:700;background:#000;color:#fff;display:none;}
#fs-btn:hover{background:#333;}
#bk-btn{position:fixed;left:18px;top:18px;padding:10px 16px;border-radius:6px;border:1px solid #000;cursor:pointer;z-index:60;font-weight:700;background:#000;color:#fff;display:none;}
#bk-btn:hover{background:#333;}
#drawer{position:fixed;right:-420px;top:0;bottom:0;width:400px;background:#fff;z-index:40;transition:right .3s;overflow-y:auto;border-left:1px solid var(--border);box-shadow:-2px 0 8px rgba(0,0,0,.1);}
#drawer.on{right:0;}
.dr-head{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.dr-head h2{color:#000;font-size:1.2rem;}
.dr-close{background:none;border:none;color:#999;font-size:24px;cursor:pointer;padding:4px;transition:color .2s;}
.dr-close:hover{color:#000;}
.dr-panels{overflow-y:auto;}
.dr-panel{display:none;padding:20px 24px;}
.dr-panel.on{display:block;}
.sg{margin:16px 0;}
.sg>span{display:block;color:#666;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.opt{padding:10px;border:1px solid var(--border);border-radius:6px;background:#f5f5f5;color:#000;cursor:pointer;font-weight:600;font-size:13px;text-align:center;transition:all .15s;}
.opt:hover{background:#e8e8e8;border-color:#000;}
.opt.on{background:#000;color:#fff;border-color:#000;}
.modal{display:none;position:fixed;z-index:55;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);}
.modal.on{display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff;padding:32px;border-radius:8px;max-width:480px;width:90%;color:var(--text);border:1px solid var(--border);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15);}
.modal-thumb{width:100%;aspect-ratio:16/9;border-radius:6px;overflow:hidden;margin-bottom:20px;position:relative;background:#e8e8e8;}
.modal-thumb-grad{width:100%;height:100%;}
.modal-thumb-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:rgba(0,0,0,.15);}
.mtrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.mtrow h2{flex:1;font-size:1.2rem;color:#000;}
.mfav{font-size:24px;background:none;border:none;cursor:pointer;color:#999;transition:color .2s;padding:4px;}
.mfav:hover,.mfav.on{color:#ffd700;}
.mstat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.mstat:last-of-type{border:none;}
.mstat b{color:#666;font-weight:600;}
.mbtns{display:flex;gap:10px;margin-top:20px;justify-content:center;}
.mbtns button{padding:12px 24px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:14px;transition:all .2s;}
.mbplay{background:#000;color:#fff;}
.mbplay:hover{background:#333;}
.mbclose{background:#f5f5f5;color:var(--text);border:1px solid var(--border);}
.mbclose:hover{background:#e8e8e8;}
.popup{display:none;position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.popup.on{display:flex;}
.popup-box{background:#fff;padding:40px;border-radius:8px;max-width:520px;width:90%;color:var(--text);border:1px solid var(--border);max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.popup-box h2{margin-top:0;color:#000;font-size:1.5rem;}
.popup-box p{line-height:1.8;color:#666;margin:14px 0;font-size:14px;}
.popup-foot{display:flex;gap:10px;margin-top:24px;justify-content:center;}
.pop-btn{padding:12px 32px;border:none;border-radius:6px;background:#000;color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:background .2s;}
.pop-btn:hover{background:#333;}
@media(max-width:1300px){#game-list{grid-template-columns:repeat(5,1fr);}}
@media(max-width:1050px){#game-list{grid-template-columns:repeat(4,1fr);}}
@media(max-width:768px){#game-list{grid-template-columns:repeat(3,1fr);gap:12px;}}
@media(max-width:480px){#game-list{grid-template-columns:repeat(2,1fr);}}
</style>
</head>

</div>

    <div class="spin"></div>

    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="bar-lbl">0%</div>
  </div>
  <iframe id="gframe" title="Game" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
</div>
<button id="fs-btn">⛶ Fullscreen</button>
<button id="bk-btn">← Back</button>

<div id="drawer">
  <div class="dr-head"><h2>⚙️ Settings</h2><button class="dr-close" id="dr-close">✕</button></div>

  </div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-thumb"><div class="modal-thumb-grad" id="m-thumb-grad"></div><div class="modal-thumb-title" id="m-thumb-title"></div></div>
    <div class="mtrow"><h2 id="m-name"></h2><button class="mfav" id="m-fav">☆</button></div>
    <div class="mstat"><b>Times Played</b><span id="m-played"></span></div>
    <div class="mstat"><b>Last Played</b><span id="m-last"></span></div>

    <div class="mbtns">
      <button class="mbplay" id="m-play">▶️ Play</button>
      <button class="mbclose" id="m-close">Close</button>
    </div>
  </div>
</div>

<div class="popup" id="upd-popup">
  <div class="popup-box">
    <h2>🎉 What's New</h2>
    <p>• Clean, minimalist design<br>• Simple search-based navigation<br>• Black and white color scheme<br>• Improved performance<br>• Easy favorites management</p>
    <div class="popup-foot"><button class="pop-btn" id="upd-ok">Got it!</button></div>

</div>

<script>
(function(){
'use strict';
const mem={};
const ls=(()=>{try{localStorage.setItem('_','1');localStorage.removeItem('_');return localStorage;}catch(e){return{getItem:k=>mem[k]??null,setItem:(k,v)=>{mem[k]=String(v);},removeItem:k=>{delete mem[k];}}}})();
const get=k=>ls.getItem('ml_'+k);
const set=(k,v)=>ls.setItem('ml_'+k,String(v));
const getStats=n=>{try{return JSON.parse(ls.getItem('mls_'+n)||'{"p":0,"d":"Never","t":0}');}catch(e){return{p:0,d:'Never',t:0};}};
const saveStats=(n,s)=>ls.setItem('mls_'+n,JSON.stringify(s));
const addTime=(n,sec)=>{const s=getStats(n);s.t=(s.t||0)+(sec/60);saveStats(n,s);};
const getFavs=()=>{try{return JSON.parse(ls.getItem('ml_favs')||'[]');}catch(e){return[];}};
const setFavs=a=>ls.setItem('ml_favs',JSON.stringify(a));
const toggleFav=n=>{let f=getFavs();f.includes(n)?f=f.filter(x=>x!==n):f.push(n);setFavs(f);return f.includes(n);};
const isFav=n=>getFavs().includes(n);
const fmtTime=m=>{const v=parseFloat((m||0).toFixed(1));return v>=60?`${Math.floor(v/60)}h ${Math.round(v%60)}m`:`${v}m`;};
const GRAD_PAIRS=[['#e0e0e0','#d0d0d0'],['#e8e8e8','#d8d8d8'],['#f0f0f0','#e0e0e0'],['#ddd','#ccc']];
function gradForName(name){let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;const pair=GRAD_PAIRS[h%GRAD_PAIRS.length];return `linear-gradient(135deg,${pair[0]},${pair[1]})`;}
function initialsFor(name){return name.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase();}
const $=id=>document.getElementById(id);
const gameList=$('game-list'),counter=$('counter'),sectionLabel=$('section-label'),
      search=$('search'),overlay=$('overlay'),gframe=$('gframe'),
      gload=$('gload'),bar=$('bar'),barLbl=$('bar-lbl'),
      fsBtn=$('fs-btn'),bkBtn=$('bk-btn'),
      settingsBtn=$('settings-btn'),drawer=$('drawer'),modal=$('modal'),
      mName=$('m-name'),mPlayed=$('m-played'),
      mLast=$('m-last'),mTime=$('m-time'),mPlay=$('m-play'),
      mClose=$('m-close'),mFav=$('m-fav');

// ── GAMES LIST START ── (auto-generated, do not edit manually)
const _G=[];
const g=(n,u)=>_G.push({n,u});
g('10 Minutes Till Dawn','10min.html');

const ALL=[..._G].sort((a,b)=>a.n.localeCompare(b.n));
const URL_MAP=new Map(ALL.map(x=>[x.u,x.n]));

let activeSearch='',curModal=null,gameStart=null;
let showFav=get('showfav')!=='off';

renderGames();

function makeCard(g,favs){
  const fav=favs.includes(g.n);const s=getStats(g.n);
  const card=document.createElement('div');card.className='card';card.dataset.n=g.n;
  const thumb=document.createElement('div');thumb.className='card-thumb';
  const grad=document.createElement('div');grad.className='card-thumb-grad';grad.style.background=gradForName(g.n);
  const init=document.createElement('div');init.className='card-initials';init.textContent=initialsFor(g.n);
  thumb.appendChild(grad);thumb.appendChild(init);
  const favBtn=document.createElement('button');favBtn.className='card-fav'+(fav&&showFav?' on':'');favBtn.textContent=fav?'★':'☆';
  if(showFav)favBtn.style.display='block';else favBtn.style.display='none';
  favBtn.onclick=e=>{e.stopPropagation();const now=toggleFav(g.n);favBtn.textContent=now?'★':'☆';favBtn.classList.toggle('on',now);renderGames();};
  thumb.appendChild(favBtn);
  const info=document.createElement('div');info.className='card-info';
  const name=document.createElement('div');name.className='card-name';name.textContent=g.n;
  info.appendChild(name);card.appendChild(thumb);card.appendChild(info);card.onclick=()=>openModal(g.n);return card;
}

function renderGames(){
  if(!ALL.length)return;
  const favs=getFavs();let list=ALL;
  if(activeSearch){const q=activeSearch.toLowerCase();list=list.filter(g=>g.n.toLowerCase().includes(q));}
  sectionLabel.textContent=activeSearch?`Results for "${activeSearch}"`:counter.textContent=`${list.length} game${list.length!==1?'s':''}`;
  counter.textContent=`${list.length} game${list.length!==1?'s':''}`;
  const frag=document.createDocumentFragment();
  for(const g of list)frag.appendChild(makeCard(g,favs));
  gameList.replaceChildren(frag);
}

let searchTimer;
search.addEventListener('input',e=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{activeSearch=e.target.value;renderGames();},150);});

function openModal(name){
  const g=ALL.find(x=>x.n===name);if(!g)return;
  curModal=name;const s=getStats(name);
  mName.textContent=name;mPlayed.textContent=s.p||0;mLast.textContent=s.d||'Never';mTime.textContent=fmtTime(s.t||0);
  mPlay.onclick=()=>launchGame(name);
  const fav=isFav(name);mFav.textContent=fav?'★':'☆';mFav.classList.toggle('on',fav);
  $('m-thumb-grad').style.background=gradForName(name);$('m-thumb-title').textContent=initialsFor(name);
  drawer.classList.remove('on');modal.classList.add('on');
}
function closeModal(){modal.classList.remove('on');curModal=null;}
mClose.onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal();};
mFav.onclick=()=>{if(!curModal)return;const now=toggleFav(curModal);mFav.textContent=now?'★':'☆';mFav.classList.toggle('on',now);renderGames();};

function launchGame(name){
  const g=ALL.find(x=>x.n===name);if(!g)return;
  const s=getStats(name);s.p=(s.p||0)+1;s.d=new Date().toLocaleDateString();saveStats(name,s);
  closeModal();drawer.classList.remove('on');settingsBtn.classList.add('hide');
  overlay.classList.add('on');gload.classList.remove('hide');fsBtn.style.display='block';bkBtn.style.display='block';
  bar.style.width='0';barLbl.textContent='0%';
  const T=3000,t0=performance.now();let barDone=false,ifrDone=false;
  function tick(now){const raw=Math.min((now-t0)/T,1);const pct=Math.round((1-Math.pow(1-raw,2))*100);bar.style.width=pct+'%';barLbl.textContent=pct+'%';if(raw<1)requestAnimationFrame(tick);else barDone=true;if(barDone&&ifrDone)gload.classList.add('hide');}
  requestAnimationFrame(tick);gameStart=Date.now();gframe.src=g.u;
  gframe.onload=()=>{ifrDone=true;if(barDone)gload.classList.add('hide');};
}

function closeGame(){
  if(gameStart){const cu=gframe.src.split('/').pop();const gn=URL_MAP.get(decodeURIComponent(cu));if(gn)addTime(gn,Math.floor((Date.now()-gameStart)/1000));gameStart=null;}
  gframe.onload=null;gframe.src='';overlay.classList.remove('on');gload.classList.remove('hide');
  bar.style.width='0';barLbl.textContent='0%';fsBtn.style.display='none';bkBtn.style.display='none';settingsBtn.classList.remove('hide');
}
bkBtn.onclick=closeGame;
fsBtn.onclick=()=>{if(gframe.requestFullscreen)gframe.requestFullscreen();};

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(overlay.classList.contains('on'))closeGame();else if(drawer.classList.contains('on'))drawer.classList.remove('on');else if(modal.classList.contains('on'))closeModal();}
  if((e.key==='f'||e.key==='F')&&overlay.classList.contains('on')){e.preventDefault();fsBtn.click();}
});

settingsBtn.onclick=e=>{e.stopPropagation();drawer.classList.toggle('on');};
$('dr-close').onclick=()=>drawer.classList.remove('on');
document.addEventListener('click',e=>{if(!e.target.closest('#drawer')&&!e.target.closest('#settings-btn'))drawer.classList.remove('on');});

document.querySelectorAll('[data-showfav]').forEach(o=>{
  o.onclick=()=>{document.querySelectorAll('[data-showfav]').forEach(x=>x.classList.remove('on'));o.classList.add('on');showFav=o.getAttribute('data-showfav')==='on';set('showfav',showFav?'on':'off');renderGames();};
});

const VER='2.0';
if(ls.getItem('ml_v')!==VER){$('upd-popup').classList.add('on');}
$('upd-ok').onclick=()=>{ls.setItem('ml_v',VER);$('upd-popup').classList.remove('on');};

})();
</script>
</body>
</html>
